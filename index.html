<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Fletes Xpress</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2.1.1/out/water.css">
	<link rel="stylesheet" href="estilos.css">

	<script src="app.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/@shaun/alpinejs-router@1.3.5/dist/cdn.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js"></script>
</head>
<body>
	<div id="app" x-data x-init="$router.config({ mode: 'hash', base: location.pathname })">

		<header class="barra">
			<h1>Fletes Xpress</h1>
			<nav class="navegacion">
				<a x-link.activity href="/">Inicio</a>
				<a x-link.activity href="/fletes/nuevo">Nuevo flete</a>
				<a x-link.activity href="/fletes/por-pagar">Por pagar</a>
				<a x-link.activity href="/clientes">Clientes</a>
				<a x-link.activity href="/choferes">Choferes</a>
				<a x-link.activity href="/unidades">Unidades</a>
			</nav>
		</header>

		<div class="aviso" :class="$store.aviso.tipo" x-show="$store.aviso.texto" x-transition x-text="$store.aviso.texto"></div>

		<main id="principal">

			<template x-route="/">
				<section x-data="inicio">
					<h2>Fletes activos</h2>
					<p x-show="cargando">Cargando…</p>

					<template x-for="grupo in grupos" :key="grupo.titulo">
						<div x-show="!cargando">
							<h3 x-text="`${grupo.titulo} (${grupo.lista.length})`"></h3>
							<p x-show="!grupo.lista.length" x-text="grupo.vacio"></p>
							<div class="fletes-cards">
								<template x-for="f in grupo.lista" :key="f.id">
									<article class="card-flete">
										<h3 x-text="`#${f.id} · ${f.origen} → ${f.destino}`"></h3>
										<p x-text="f.cliente"></p>
										<p class="chofer" x-text="f.chofer"></p>
										<p x-text="`${f.placa} · ${f.marca} ${f.modelo}`"></p>
										<p class="monto" x-text="dinero(f.monto)"></p>
										<span :class="f.pagado ? 'badge-pagado' : 'badge-pendiente'" x-text="f.pagado ? 'Pagado' : 'Por cobrar'"></span>
										<p>
											<button @click="avanzar(f)" x-text="f.estatus === 'pendiente' ? 'Iniciar viaje' : 'Marcar entregado'"></button>
										</p>
									</article>
								</template>
							</div>
						</div>
					</template>
				</section>
			</template>

			<template x-route="/fletes/nuevo">
				<section x-data="nuevoFlete">
					<h2>Nuevo flete</h2>
					<form @submit.prevent="guardar" class="rejilla">
						<label>Cliente
							<select x-model="form.cliente_id" required>
								<option value="">Selecciona…</option>
								<template x-for="c in clientes" :key="c.id">
									<option :value="c.id" x-text="c.razon_social"></option>
								</template>
							</select>
							<small class="error-campo" x-text="errores.cliente_id"></small>
						</label>

						<label>Chofer disponible
							<select x-model="form.chofer_id" required>
								<option value="" x-text="choferes.length ? 'Selecciona…' : 'No hay choferes disponibles'"></option>
								<template x-for="c in choferes" :key="c.id">
									<option :value="c.id" x-text="c.nombre"></option>
								</template>
							</select>
							<small class="error-campo" x-text="errores.chofer_id"></small>
						</label>

						<label>Unidad disponible
							<select x-model="form.unidad_id" required>
								<option value="" x-text="unidades.length ? 'Selecciona…' : 'No hay unidades disponibles'"></option>
								<template x-for="u in unidades" :key="u.id">
									<option :value="u.id" x-text="`${u.placa} · ${u.marca} ${u.modelo}`"></option>
								</template>
							</select>
							<small class="error-campo" x-text="errores.unidad_id"></small>
						</label>

						<label>Monto (MXN)
							<input type="number" min="1" step="0.01" x-model="form.monto" required>
							<small class="error-campo" x-text="errores.monto"></small>
						</label>

						<label>Origen
							<input x-model="form.origen" required>
							<small class="error-campo" x-text="errores.origen"></small>
						</label>

						<label>Destino
							<input x-model="form.destino" required>
							<small class="error-campo" x-text="errores.destino"></small>
						</label>

						<div>
							<button :disabled="guardando">Registrar flete</button>
							<a x-link href="/">Cancelar</a>
						</div>
					</form>
				</section>
			</template>

			<template x-route="/fletes/por-pagar">
				<section x-data="porPagar">
					<h2>Fletes por pagar</h2>
					<p x-show="cargando">Cargando…</p>
					<div x-show="!cargando">
						<p x-show="!fletes.length">No hay fletes pendientes de pago.</p>
						<table x-show="fletes.length">
							<thead><tr><th>#</th><th>Fecha</th><th>Cliente</th><th>Ruta</th><th>Estatus</th><th>Monto</th><th></th></tr></thead>
							<tbody>
								<template x-for="f in fletes" :key="f.id">
									<tr>
										<td x-text="f.id"></td>
										<td x-text="f.fecha"></td>
										<td x-text="f.cliente"></td>
										<td x-text="`${f.origen} → ${f.destino}`"></td>
										<td x-text="etiqueta(f.estatus)"></td>
										<td x-text="dinero(f.monto)"></td>
										<td class="acciones"><button @click="pagar(f)">Marcar pagado</button></td>
									</tr>
								</template>
							</tbody>
							<tfoot><tr><th colspan="5">Total por cobrar</th><th x-text="dinero(total)"></th><th></th></tr></tfoot>
						</table>
					</div>
				</section>
			</template>

			<template x-route="/clientes">
				<section x-data="catalogo('clientes', ['razon_social', 'rfc', 'email'])">
					<h2>Clientes</h2>
					<form @submit.prevent="guardar">
						<fieldset>
							<legend x-text="editando ? `Editar cliente #${editando}` : 'Nuevo cliente'"></legend>
							<label>Razón social <input x-model="form.razon_social" required></label>
							<small class="error-campo" x-text="errores.razon_social"></small>
							<label>RFC <input x-model="form.rfc" required maxlength="13" placeholder="ABC010101XY1"></label>
							<small class="error-campo" x-text="errores.rfc"></small>
							<label>Email <input type="email" x-model="form.email" required></label>
							<small class="error-campo" x-text="errores.email"></small>
							<div>
								<button :disabled="guardando" x-text="editando ? 'Guardar cambios' : 'Agregar'"></button>
								<button type="button" x-show="editando" @click="limpiar()">Cancelar</button>
							</div>
						</fieldset>
					</form>

					<p x-show="cargando">Cargando…</p>
					<table x-show="!cargando">
						<thead><tr><th>#</th><th>Razón social</th><th>RFC</th><th>Email</th><th></th></tr></thead>
						<tbody>
							<template x-for="c in filas" :key="c.id">
								<tr>
									<td x-text="c.id"></td>
									<td x-text="c.razon_social"></td>
									<td x-text="c.rfc"></td>
									<td x-text="c.email"></td>
									<td class="acciones">
										<button @click="editar(c)">Editar</button>
										<button @click="eliminar(c, c.razon_social)">Eliminar</button>
									</td>
								</tr>
							</template>
						</tbody>
					</table>
				</section>
			</template>

			<template x-route="/choferes">
				<section x-data="catalogo('choferes', ['nombre', 'licencia'])">
					<h2>Choferes</h2>
					<form @submit.prevent="guardar">
						<fieldset>
							<legend x-text="editando ? `Editar chofer #${editando}` : 'Nuevo chofer'"></legend>
							<label>Nombre <input x-model="form.nombre" required></label>
							<small class="error-campo" x-text="errores.nombre"></small>
							<label>Licencia <input x-model="form.licencia" required></label>
							<small class="error-campo" x-text="errores.licencia"></small>
							<div>
								<button :disabled="guardando" x-text="editando ? 'Guardar cambios' : 'Agregar'"></button>
								<button type="button" x-show="editando" @click="limpiar()">Cancelar</button>
							</div>
						</fieldset>
					</form>

					<p x-show="cargando">Cargando…</p>
					<table x-show="!cargando">
						<thead><tr><th>#</th><th>Nombre</th><th>Licencia</th><th>Estado</th><th></th></tr></thead>
						<tbody>
							<template x-for="c in filas" :key="c.id">
								<tr>
									<td x-text="c.id"></td>
									<td x-text="c.nombre"></td>
									<td x-text="c.licencia"></td>
									<td>
										<span class="estado" :class="c.estado" x-text="etiqueta(c.estado)"></span>
										<small x-show="c.flete_actual" x-text="`flete #${c.flete_actual}`"></small>
									</td>
									<td class="acciones">
										<button @click="editar(c)">Editar</button>
										<button @click="eliminar(c, c.nombre)">Eliminar</button>
									</td>
								</tr>
							</template>
						</tbody>
					</table>
				</section>
			</template>

			<template x-route="/unidades">
				<section x-data="catalogo('unidades', ['placa', 'marca', 'modelo', 'anio'])">
					<h2>Unidades</h2>
					<form @submit.prevent="guardar">
						<fieldset>
							<legend x-text="editando ? `Editar unidad #${editando}` : 'Nueva unidad'"></legend>
							<label>Placa <input x-model="form.placa" required placeholder="GT-1234-A"></label>
							<small class="error-campo" x-text="errores.placa"></small>
							<label>Marca <input x-model="form.marca" required placeholder="Kenworth"></label>
							<small class="error-campo" x-text="errores.marca"></small>
							<label>Modelo <input x-model="form.modelo" required placeholder="T680"></label>
							<small class="error-campo" x-text="errores.modelo"></small>
							<label>Año <input type="number" x-model="form.anio" required min="1950" max="2100"></label>
							<small class="error-campo" x-text="errores.anio"></small>
							<div>
								<button :disabled="guardando" x-text="editando ? 'Guardar cambios' : 'Agregar'"></button>
								<button type="button" x-show="editando" @click="limpiar()">Cancelar</button>
							</div>
						</fieldset>
					</form>

					<p x-show="cargando">Cargando…</p>
					<table x-show="!cargando">
						<thead><tr><th>#</th><th>Placa</th><th>Marca</th><th>Modelo</th><th>Año</th><th>Estado</th><th></th></tr></thead>
						<tbody>
							<template x-for="u in filas" :key="u.id">
								<tr>
									<td x-text="u.id"></td>
									<td x-text="u.placa"></td>
									<td x-text="u.marca"></td>
									<td x-text="u.modelo"></td>
									<td x-text="u.anio"></td>
									<td>
										<span class="estado" :class="u.estado" x-text="etiqueta(u.estado)"></span>
										<small x-show="u.flete_actual" x-text="`flete #${u.flete_actual}`"></small>
									</td>
									<td class="acciones">
										<button @click="editar(u)">Editar</button>
										<button @click="eliminar(u, `la unidad ${u.placa}`)">Eliminar</button>
									</td>
								</tr>
							</template>
						</tbody>
					</table>
				</section>
			</template>

			<template x-route.notfound>
				<section>
					<h2>Página no encontrada</h2>
					<a x-link href="/">Volver al inicio</a>
				</section>
			</template>

		</main>

		<footer>
			Derechos reservados por AM
		</footer>
	</div>
</body>
</html>
